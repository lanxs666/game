<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <meta name="description" content="滑动数字方块，合成 2048，挑战你的逻辑极限！">
  <title>2048 | 畅游</title>
  <link rel="stylesheet" href="account.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #090d12;
      --panel: #10171e;
      --panel-raised: #151e27;
      --line: #24313d;
      --text: #eaf2f7;
      --muted: #8b9aa7;
      --lime: #a5ff65;
      --cyan: #65e9ff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(33, 57, 68, .2), transparent 48%),
        var(--page);
      color: var(--text);
    }

    button, a { font: inherit; }
    a { color: inherit; }

    .game { width: min(100%, 590px); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 17px;
    }

    .brand { display: flex; min-width: 0; align-items: center; gap: 11px; }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(198, 250, 114, .23);
      border-radius: 12px;
      background: rgba(198, 250, 114, .08);
      color: var(--lime);
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 0 22px rgba(198, 250, 114, .08);
    }

    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.04em; }
    .eyebrow { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .top-links { display: flex; align-items: center; gap: 14px; }

    .home-link, .rank-link {
      color: #a7b4be;
      font-size: 11px;
      text-decoration: none;
      white-space: nowrap;
    }

    .home-link:hover, .rank-link:hover { color: var(--lime); }
    .home-link:focus-visible, .rank-link:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .intro h2 { margin: 0; font-size: 25px; letter-spacing: -.06em; }
    .intro p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .stat {
      min-width: 0;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(18, 26, 35, .92), rgba(13, 19, 26, .96));
    }

    .stat-label { color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .1em; }
    .stat-value {
      display: block;
      overflow: hidden;
      margin-top: 4px;
      color: var(--lime);
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-overflow: ellipsis;
    }

    .board-wrap {
      position: relative;
      margin-top: 11px;
      padding: 10px;
      border: 1px solid #283440;
      border-radius: 15px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(101, 233, 255, .045), transparent 65%),
        #0b1117;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .34), 0 0 34px rgba(101, 233, 255, .035);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .board {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      aspect-ratio: 1;
    }

    .cell {
      display: grid;
      min-width: 0;
      min-height: 0;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(144, 166, 181, .055);
      border-radius: 9px;
      background: rgba(144, 166, 181, .075);
      color: #eaf2f7;
      font-size: clamp(19px, 6vw, 34px);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      letter-spacing: -.055em;
      transition: background .12s ease, color .12s ease, transform .12s ease, box-shadow .12s ease;
    }

    .cell[data-value="2"] { background: #253522; color: #d9ffc1; }
    .cell[data-value="4"] { background: #344b30; color: #e2ffca; }
    .cell[data-value="8"] { background: #526a32; color: #efffd0; box-shadow: inset 0 0 18px rgba(198, 250, 114, .08); }
    .cell[data-value="16"] { background: #7c7130; color: #fff3bd; }
    .cell[data-value="32"] { background: #a76738; color: #fff0ce; }
    .cell[data-value="64"] { background: #bd5946; color: #ffe3d9; }
    .cell[data-value="128"] { background: #9d4970; color: #ffe2f1; font-size: clamp(16px, 5vw, 27px); box-shadow: 0 0 14px rgba(255, 91, 157, .12); }
    .cell[data-value="256"] { background: #824c91; color: #f7ddff; font-size: clamp(16px, 5vw, 27px); }
    .cell[data-value="512"] { background: #5367a4; color: #e0e9ff; font-size: clamp(16px, 5vw, 27px); }
    .cell[data-value="1024"], .cell[data-value="2048"] {
      background: linear-gradient(145deg, #d6f77c, #7fdc80);
      color: #142016;
      font-size: clamp(14px, 4.5vw, 23px);
      box-shadow: 0 0 19px rgba(165, 255, 101, .32);
    }
    .cell[data-value="2048"] { animation: tile-glow 1.8s ease-in-out infinite alternate; }

    @keyframes tile-glow {
      from { box-shadow: 0 0 12px rgba(165, 255, 101, .23); }
      to { box-shadow: 0 0 28px rgba(165, 255, 101, .58); }
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: 11px;
      background: rgba(5, 9, 13, .76);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .overlay-card {
      width: min(100%, 300px);
      padding: 23px 20px;
      border: 1px solid rgba(134, 160, 177, .22);
      border-radius: 15px;
      background: rgba(14, 21, 28, .95);
      box-shadow: 0 16px 55px rgba(0, 0, 0, .4);
    }

    .overlay h3 { margin: 0; font-size: 21px; letter-spacing: -.04em; }
    .overlay p { margin: 8px 0 17px; color: #9baab6; font-size: 12px; line-height: 1.6; }

    .primary-button {
      min-height: 52px;
      padding: 0 26px;
      border: 0;
      border-radius: 10px;
      background: var(--lime);
      color: #10170e;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      box-shadow: 0 4px 18px rgba(165, 255, 101, .17);
      transition: filter .15s ease, transform .15s ease, box-shadow .15s ease;
    }

    .primary-button:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 22px rgba(165, 255, 101, .25); }

    .game-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .control-hint { max-width: 360px; }

    .restart-button {
      min-height: 35px;
      flex: 0 0 auto;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: #c9d4dc;
      cursor: pointer;
      font-size: 10px;
    }

    .restart-button:hover { border-color: rgba(198, 250, 114, .3); color: var(--lime); }

    .status { min-height: 18px; margin: 7px 2px 0; color: #c0cbd4; font-size: 10px; }

    .leaderboard {
      margin-top: 16px;
      padding: 15px 16px 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(18, 26, 35, .92), rgba(13, 19, 26, .96));
    }

    .leaderboard-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .leaderboard-panel { min-width: 0; }

    .leaderboard-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .leaderboard h2 { margin: 0; font-size: 13px; font-weight: 650; }
    .leaderboard-link { color: var(--lime); font-size: 10px; text-decoration: none; }
    .leaderboard-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .leaderboard-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; min-height: 34px; align-items: center; gap: 5px; border-top: 1px solid rgba(144, 166, 181, .08); color: #c3ced6; font-size: 10px; }
    .leaderboard-rank { color: var(--muted); font-variant-numeric: tabular-nums; }
    .leaderboard-row:first-child .leaderboard-rank, .leaderboard-row:first-child .leaderboard-score { color: var(--lime); }
    .leaderboard-person { display: flex; min-width: 0; align-items: center; gap: 6px; }
    .leaderboard-avatar { display: grid; width: 23px; height: 23px; flex: 0 0 auto; overflow: hidden; place-items: center; border-radius: 50%; background: #202830; font-size: 12px; }
    .leaderboard-avatar img { display: block; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
    .leaderboard-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .leaderboard-date { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
    .leaderboard-score { font-variant-numeric: tabular-nums; font-weight: 650; }
    .leaderboard-empty { padding: 11px 0 6px; color: var(--muted); font-size: 10px; line-height: 1.6; }

    @media (max-width: 520px) {
      body { padding: 18px 14px; }
      .topline { align-items: flex-start; }
      .top-links { flex-direction: column-reverse; align-items: flex-end; gap: 8px; }
      .intro h2 { font-size: 22px; }
      .board-wrap { padding: 7px; }
      .board { gap: 6px; }
      .cell { border-radius: 7px; }
      .overlay { inset: 7px; }
      .leaderboard-columns { grid-template-columns: 1fr; gap: 15px; }
      .leaderboard-row { min-height: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="2048 数字方块游戏">
    <header class="topline">
      <div class="brand">
        <button class="account-trigger" type="button" aria-label="登录或注册">🟢</button>
        <div class="brand-mark" aria-hidden="true">2048</div>
        <div>
          <h1>2048</h1>
          <p class="eyebrow">滑动方块，合成更大的数字。</p>
        </div>
      </div>
      <nav class="top-links" aria-label="游戏导航">
        <a class="rank-link" href="leaderboard.html">全站排名 ↗</a>
        <a class="home-link" href="index.html">← 返回游戏库</a>
      </nav>
    </header>

    <section class="intro" aria-labelledby="gameTitle">
      <div>
        <h2 id="gameTitle">合成 2048</h2>
        <p>相同数字相撞即可合并。继续滑动，挑战更高分！</p>
      </div>
    </section>

    <section class="stats" aria-label="游戏分数">
      <div class="stat">
        <span class="stat-label">本局得分</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">本机最佳</span>
        <strong class="stat-value" id="best">0</strong>
      </div>
    </section>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board" role="grid" aria-label="4 乘 4 数字方块棋盘"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h3 id="overlayTitle"></h3>
          <p id="overlayMessage"></p>
          <button class="primary-button" id="overlayButton" type="button">开始游戏</button>
        </div>
      </div>
    </div>

    <div class="game-controls">
      <div class="control-hint">使用 <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，也可在棋盘上滑动。</div>
      <button class="restart-button" id="restartButton" type="button">重新开始</button>
    </div>
    <p class="status" id="status" aria-live="polite">准备开始</p>

    <section class="leaderboard" aria-label="2048 排行榜">
      <div class="leaderboard-columns">
        <section class="leaderboard-panel" aria-labelledby="globalTitle">
          <div class="leaderboard-header">
            <h2 id="globalTitle">🏆 全站榜单</h2>
            <a class="leaderboard-link" href="leaderboard.html">查看完整排名 ↗</a>
          </div>
          <ol class="leaderboard-list" id="globalList" aria-live="polite"></ol>
        </section>
        <section class="leaderboard-panel" aria-labelledby="personalTitle">
          <div class="leaderboard-header">
            <h2 id="personalTitle">✨ 我的记录</h2>
            <span class="leaderboard-link">个人前 5</span>
          </div>
          <ol class="leaderboard-list" id="personalList" aria-live="polite"></ol>
        </section>
      </div>
    </section>
  </main>

  <script src="supabase-config.js"></script>
  <script src="site-account.js"></script>
  <script>
    (() => {
      const size = 4;
      const boardElement = document.getElementById("board");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("best");
      const statusElement = document.getElementById("status");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayMessage = document.getElementById("overlayMessage");
      const overlayButton = document.getElementById("overlayButton");
      const globalList = document.getElementById("globalList");
      const personalList = document.getElementById("personalList");
      const gameSlug = "2048";
      const bestStorageKey = "2048-best";
      const keyDirections = {
        ArrowLeft: "left", KeyA: "left",
        ArrowRight: "right", KeyD: "right",
        ArrowUp: "up", KeyW: "up",
        ArrowDown: "down", KeyS: "down"
      };

      let grid = createGrid();
      let score = 0;
      let best = readBest();
      let won = false;
      let ended = false;
      let keepPlaying = false;
      let touchStart = null;
      let submittedScore = false;

      bestElement.textContent = formatNumber(best);
      renderBoard();
      startNewGame(false);
      refreshLeaderboards();
      window.gameSite.onAuthChanged(() => refreshLeaderboards());

      function createGrid() {
        return Array.from({ length: size }, () => Array(size).fill(0));
      }

      function formatNumber(value) {
        return Number(value).toLocaleString("en-US");
      }

      function readBest() {
        try {
          return Number(localStorage.getItem(bestStorageKey)) || 0;
        } catch (error) {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem(bestStorageKey, String(best));
        } catch (error) {
          statusElement.textContent = "本机无法保存最佳分数。";
        }
      }

      function renderBoard() {
        boardElement.replaceChildren();
        const fragment = document.createDocumentFragment();
        for (let row = 0; row < size; row += 1) {
          for (let column = 0; column < size; column += 1) {
            const value = grid[row][column];
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.setAttribute("role", "gridcell");
            cell.setAttribute("aria-label", value ? String(value) : "空");
            if (value) {
              cell.dataset.value = String(value);
              cell.textContent = formatNumber(value);
            }
            fragment.append(cell);
          }
        }
        boardElement.append(fragment);
        scoreElement.textContent = formatNumber(score);
        bestElement.textContent = formatNumber(best);
      }

      function addRandomTile() {
        const emptyCells = [];
        for (let row = 0; row < size; row += 1) {
          for (let column = 0; column < size; column += 1) {
            if (!grid[row][column]) emptyCells.push({ row, column });
          }
        }
        if (!emptyCells.length) return false;
        const cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        grid[cell.row][cell.column] = Math.random() < 0.9 ? 2 : 4;
        return true;
      }

      function startNewGame(showStatus = true) {
        grid = createGrid();
        score = 0;
        won = false;
        ended = false;
        keepPlaying = false;
        submittedScore = false;
        overlay.hidden = true;
        addRandomTile();
        addRandomTile();
        renderBoard();
        if (showStatus) statusElement.textContent = "新的一局开始了。";
      }

      function slideLine(line) {
        const compact = line.filter(Boolean);
        const merged = [];
        let gained = 0;
        for (let index = 0; index < compact.length; index += 1) {
          if (compact[index] === compact[index + 1]) {
            const value = compact[index] * 2;
            merged.push(value);
            gained += value;
            index += 1;
          } else {
            merged.push(compact[index]);
          }
        }
        while (merged.length < size) merged.push(0);
        return { line: merged, gained };
      }

      function move(direction) {
        if (ended || overlay.hidden === false && won && !keepPlaying) return;
        const previous = grid.map((row) => row.slice());
        let gained = 0;
        const next = createGrid();

        for (let lineIndex = 0; lineIndex < size; lineIndex += 1) {
          const coordinates = [];
          for (let step = 0; step < size; step += 1) {
            if (direction === "left") coordinates.push([lineIndex, step]);
            if (direction === "right") coordinates.push([lineIndex, size - 1 - step]);
            if (direction === "up") coordinates.push([step, lineIndex]);
            if (direction === "down") coordinates.push([size - 1 - step, lineIndex]);
          }
          const values = coordinates.map(([row, column]) => grid[row][column]);
          const result = slideLine(values);
          gained += result.gained;
          coordinates.forEach(([row, column], index) => { next[row][column] = result.line[index]; });
        }

        const changed = next.some((row, rowIndex) => row.some((value, columnIndex) => value !== previous[rowIndex][columnIndex]));
        if (!changed) return;

        grid = next;
        score += gained;
        if (score > best) {
          best = score;
          saveBest();
        }
        addRandomTile();
        renderBoard();

        if (!won && !keepPlaying && grid.some((row) => row.includes(2048))) {
          won = true;
          showOverlay("你合成了 2048！", "太棒了！继续挑战更高分，或重新开始并保存本局成绩。", "继续挑战", "continue");
          statusElement.textContent = "2048 达成！";
          return;
        }

        if (isGameOver()) {
          ended = true;
          showOverlay("没有可移动的方块了", `本局得分：${formatNumber(score)}，再来一局挑战更高分吧。`, "再玩一局", "restart");
          statusElement.textContent = "游戏结束";
          submitScore();
          return;
        }

        statusElement.textContent = gained ? `合并成功，获得 ${formatNumber(gained)} 分。` : "继续合成更大的数字。";
      }

      function isGameOver() {
        for (let row = 0; row < size; row += 1) {
          for (let column = 0; column < size; column += 1) {
            if (grid[row][column] === 0) return false;
            if (column < size - 1 && grid[row][column] === grid[row][column + 1]) return false;
            if (row < size - 1 && grid[row][column] === grid[row + 1][column]) return false;
          }
        }
        return true;
      }

      function showOverlay(title, message, buttonText, action) {
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        overlayButton.textContent = buttonText;
        overlayButton.dataset.action = action;
        overlay.hidden = false;
      }

      function handleOverlayAction() {
        if (overlayButton.dataset.action === "continue") {
          keepPlaying = true;
          overlay.hidden = true;
          statusElement.textContent = "继续挑战更高分！";
        } else {
          startNewGame();
        }
      }

      async function submitScore() {
        if (submittedScore || score <= 0) return;
        submittedScore = true;
        try {
          await window.gameSite.submitScore(gameSlug, score);
          statusElement.textContent = `${statusElement.textContent} 成绩已提交。`;
          await refreshLeaderboards();
        } catch (error) {
          submittedScore = false;
          statusElement.textContent = error.message.includes("登录后")
            ? `${statusElement.textContent} 登录后可提交成绩。`
            : `${statusElement.textContent} 成绩提交失败。`;
          console.error("Unable to submit 2048 score.", error);
        }
      }

      async function refreshLeaderboards() {
        if (!window.gameSite.isConfigured) {
          renderLeaderboard(globalList, [], "排行榜服务尚未配置。");
          renderLeaderboard(personalList, [], "排行榜服务尚未配置。");
          return;
        }
        try {
          const globalScores = await window.gameSite.getScores(gameSlug, "global", 10);
          renderLeaderboard(globalList, globalScores, "还没有上榜成绩，来成为第一个挑战者吧。");
          if (window.gameSite.user) {
            const personalScores = await window.gameSite.getScores(gameSlug, "personal", 5);
            renderLeaderboard(personalList, personalScores, "完成一局后，你的成绩会显示在这里。");
          } else {
            renderLeaderboard(personalList, [], "登录后查看并保存个人前五成绩。");
          }
        } catch (error) {
          renderLeaderboard(globalList, [], "排行榜暂时无法加载。");
          renderLeaderboard(personalList, [], "排行榜暂时无法加载。");
          statusElement.textContent = error.message;
        }
      }

      function renderLeaderboard(list, entries, emptyMessage) {
        list.replaceChildren();
        if (!entries.length) {
          const empty = document.createElement("li");
          empty.className = "leaderboard-empty";
          empty.textContent = emptyMessage;
          list.append(empty);
          return;
        }
        entries.forEach((entry, index) => {
          const row = document.createElement("li");
          row.className = "leaderboard-row";
          const rank = document.createElement("span");
          rank.className = "leaderboard-rank";
          rank.textContent = String(index + 1).padStart(2, "0");
          const person = document.createElement("span");
          person.className = "leaderboard-person";
          const avatar = document.createElement("span");
          avatar.className = "leaderboard-avatar";
          avatar.setAttribute("aria-hidden", "true");
          renderAvatar(avatar, entry.profiles && entry.profiles.avatar);
          const identity = document.createElement("span");
          identity.className = "leaderboard-name";
          const nickname = document.createElement("span");
          nickname.textContent = entry.profiles && entry.profiles.nickname || "玩家";
          const date = document.createElement("time");
          date.className = "leaderboard-date";
          date.dateTime = entry.created_at;
          date.textContent = new Date(entry.created_at).toLocaleDateString("zh-CN");
          identity.append(nickname, date);
          person.append(avatar, identity);
          const points = document.createElement("strong");
          points.className = "leaderboard-score";
          points.textContent = formatNumber(entry.score);
          row.append(rank, person, points);
          list.append(row);
        });
      }

      function renderAvatar(container, value) {
        try {
          const imageUrl = new URL(value);
          const projectUrl = new URL(window.GAME_SITE_SUPABASE.url);
          if (imageUrl.origin === projectUrl.origin && imageUrl.pathname.startsWith("/storage/v1/object/public/profile-avatars/")) {
            const image = document.createElement("img");
            image.alt = "";
            image.src = imageUrl.href;
            image.addEventListener("error", () => image.replaceWith(document.createTextNode("🟢")), { once: true });
            container.append(image);
            return;
          }
        } catch (error) {
          // Emoji avatars are not URLs.
        }
        container.textContent = value || "🟢";
      }

      document.addEventListener("keydown", (event) => {
        const direction = keyDirections[event.code];
        if (!direction) return;
        event.preventDefault();
        move(direction);
      });

      document.getElementById("boardWrap").addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse") return;
        touchStart = { x: event.clientX, y: event.clientY };
      });

      document.getElementById("boardWrap").addEventListener("pointerup", (event) => {
        if (!touchStart) return;
        const deltaX = event.clientX - touchStart.x;
        const deltaY = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 24) return;
        if (Math.abs(deltaX) > Math.abs(deltaY)) move(deltaX > 0 ? "right" : "left");
        else move(deltaY > 0 ? "down" : "up");
      });

      overlayButton.addEventListener("click", handleOverlayAction);
      document.getElementById("restartButton").addEventListener("click", async () => {
        if (won && !submittedScore) await submitScore();
        startNewGame();
      });
    })();
  </script>
</body>
</html>
