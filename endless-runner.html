<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <meta name="description" content="按下跳跃，在不断加速的跑酷挑战中躲过障碍。">
  <title>无尽跑酷 | 畅游</title>
  <link rel="stylesheet" href="account.css">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --page: #090d12; --line: #24313d; --text: #eaf2f7; --muted: #8b9aa7; --lime: #a5ff65; --cyan: #65e9ff; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 22px 14px; background: radial-gradient(ellipse at 50% 0%, rgba(33,57,68,.2), transparent 48%), var(--page); color: var(--text); }
    button, a { font: inherit; } a { color: inherit; }
    .game { width: min(100%, 800px); } .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; } .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid rgba(165,255,101,.23); border-radius: 12px; background: rgba(165,255,101,.08); color: var(--lime); font-size: 19px; }
    h1 { margin: 0; font-size: 17px; } .eyebrow { margin: 3px 0 0; color: var(--muted); font-size: 11px; } .top-links { display: flex; gap: 12px; } .top-links a { color: #a7b4be; font-size: 10px; text-decoration: none; white-space: nowrap; }
    .scoreboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-bottom: 10px; } .stat { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #10171e; }
    .stat-label { color: var(--muted); font-size: 9px; letter-spacing: .1em; } .stat-value { display: block; margin-top: 3px; font-size: 20px; font-variant-numeric: tabular-nums; } .stat-value.current { color: var(--lime); }
    .board-wrap { position: relative; overflow: hidden; border: 1px solid #283440; border-radius: 13px; background: #0b1117; box-shadow: 0 20px 60px rgba(0,0,0,.3); } canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; touch-action: manipulation; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(5,9,13,.7); backdrop-filter: blur(4px); text-align: center; } .overlay[hidden] { display: none; }
    .overlay-card { width: min(100%, 310px); padding: 20px; border: 1px solid rgba(134,160,177,.22); border-radius: 14px; background: rgba(14,21,28,.96); } .overlay h2 { margin: 0; font-size: 20px; } .overlay p { color: #9baab6; font-size: 12px; line-height: 1.6; }
    .primary-button { min-height: 44px; padding: 0 23px; border: 0; border-radius: 9px; background: var(--lime); color: #10170e; cursor: pointer; font-weight: 750; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0; color: var(--muted); font-size: 10px; } .jump-button { min-width: 110px; min-height: 43px; border: 1px solid rgba(165,255,101,.3); border-radius: 9px; background: rgba(165,255,101,.09); color: var(--lime); font-weight: 700; touch-action: manipulation; }
    kbd { padding: 2px 5px; border: 1px solid #293542; border-radius: 5px; background: #111922; color: #c1ccd5; }
    .status { min-height: 15px; margin: 5px 2px; color: #c0cbd4; font-size: 10px; }
    .leaderboard { margin-top: 12px; padding: 13px 14px 8px; border: 1px solid var(--line); border-radius: 12px; background: #10171e; } .leaderboard-columns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; } .leaderboard-header { display: flex; justify-content: space-between; gap: 7px; margin-bottom: 7px; } .leaderboard h2 { margin: 0; font-size: 12px; }
    .leaderboard-link { color: var(--lime); font-size: 9px; text-decoration: none; } .leaderboard-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; } .leaderboard-row { display: grid; grid-template-columns: 21px minmax(0,1fr) auto; min-height: 28px; align-items: center; gap: 5px; border-top: 1px solid rgba(144,166,181,.08); color: #c3ced6; font-size: 9px; }
    .leaderboard-rank, .leaderboard-date { color: var(--muted); } .leaderboard-row:first-child .leaderboard-rank, .leaderboard-row:first-child .leaderboard-score { color: var(--lime); } .leaderboard-person { display: flex; align-items: center; gap: 5px; min-width: 0; } .leaderboard-avatar { display: grid; width: 20px; height: 20px; flex: 0 0 auto; overflow: hidden; place-items: center; border-radius: 50%; background: #202830; } .leaderboard-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .leaderboard-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .leaderboard-date { display: block; font-size: 8px; } .leaderboard-empty { padding: 8px 0; color: var(--muted); font-size: 9px; }
    @media (max-width: 500px) { body { padding: 14px 9px; } .controls { align-items: flex-start; } .leaderboard-columns { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="game" aria-label="无尽跑酷游戏">
    <header class="topline"><div class="brand"><button class="account-trigger" type="button" aria-label="登录或注册">🟢</button><span class="brand-mark" aria-hidden="true">➜</span><div><h1>无尽跑酷</h1><p class="eyebrow">双段跳跃，躲开迎面而来的障碍。</p></div></div><nav class="top-links" aria-label="游戏导航"><a href="leaderboard.html">全站排名 ↗</a><a href="index.html">← 游戏库</a></nav></header>
    <section class="scoreboard" aria-label="游戏统计"><div class="stat"><span class="stat-label">得分</span><strong class="stat-value current" id="score">0</strong></div><div class="stat"><span class="stat-label">速度</span><strong class="stat-value" id="speed">1.0×</strong></div></section>
    <div class="board-wrap"><canvas id="board" width="800" height="400" aria-label="无尽跑酷游戏区域"></canvas><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayMessage">按空格或上方向键跳跃。空中还能再跳一次，躲过障碍即可得分。</p><button class="primary-button" id="startButton" type="button">开始奔跑</button></div></div></div>
    <div class="controls"><span><kbd>Space</kbd> / <kbd>↑</kbd> 跳跃　·　最多二段跳</span><button class="jump-button" id="jumpButton" type="button">跳 跃</button></div>
    <p class="status" id="status" aria-live="polite">准备开始</p>
    <section class="leaderboard" aria-label="无尽跑酷排行榜"><div class="leaderboard-columns"><section><div class="leaderboard-header"><h2>🏆 全站榜单</h2><a class="leaderboard-link" href="leaderboard.html">完整排名 ↗</a></div><ol class="leaderboard-list" id="globalList" aria-live="polite"></ol></section><section><div class="leaderboard-header"><h2>✨ 我的记录</h2><span class="leaderboard-link">个人前 5</span></div><ol class="leaderboard-list" id="personalList" aria-live="polite"></ol></section></div></section>
  </main>
  <script src="supabase-config.js"></script><script src="site-account.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById("board"), ctx = canvas.getContext("2d"), scoreEl = document.getElementById("score"), speedEl = document.getElementById("speed"), statusEl = document.getElementById("status"), overlay = document.getElementById("overlay"), titleEl = document.getElementById("overlayTitle"), messageEl = document.getElementById("overlayMessage"), startButton = document.getElementById("startButton"), globalList = document.getElementById("globalList"), personalList = document.getElementById("personalList"), gameSlug = "endless-runner";
      const width = canvas.width, height = canvas.height, groundY = 326;
      let player, obstacles = [], score = 0, speed = 270, spawnIn = 1, groundOffset = 0, jumpsLeft = 2, state = "ready", lastFrame = 0, audioContext = null;
      refreshLeaderboards(); window.gameSite.onAuthChanged(() => refreshLeaderboards()); reset(); draw();
      function reset() { player = { x: 92, y: groundY - 42, width: 30, height: 42, velocityY: 0 }; obstacles = []; score = 0; speed = 270; spawnIn = .95; groundOffset = 0; jumpsLeft = 2; scoreEl.textContent = "0"; speedEl.textContent = "1.0×"; }
      function startGame() { if (state === "running") return; if (state === "ready" || state === "over") reset(); state = "running"; overlay.hidden = true; statusEl.textContent = "奔跑中！"; lastFrame = 0; getAudio(); requestAnimationFrame(loop); }
      function jump() { if (state !== "running") { if (state === "ready" || state === "over") startGame(); if (state !== "running") return; } if (jumpsLeft <= 0) return; player.velocityY = jumpsLeft === 2 ? -465 : -405; jumpsLeft -= 1; playTone(jumpsLeft ? 510 : 680, .08); }
      function loop(timestamp) { if (state !== "running") return; const dt = Math.min((timestamp - (lastFrame || timestamp)) / 1000, .04); lastFrame = timestamp; update(dt); draw(); if (state === "running") requestAnimationFrame(loop); }
      function update(dt) {
        speed = Math.min(680, 270 + score * 1.3);
        player.velocityY += 1180 * dt; player.y += player.velocityY * dt;
        if (player.y + player.height >= groundY) { player.y = groundY - player.height; player.velocityY = 0; jumpsLeft = 2; }
        groundOffset = (groundOffset + speed * dt) % 42;
        spawnIn -= dt;
        if (spawnIn <= 0) {
          const h = 28 + Math.random() * 52, w = 19 + Math.random() * 19;
          obstacles.push({ x: width + 8, y: groundY - h, width: w, height: h, passed: false });
          spawnIn = Math.max(.78, 1.3 + Math.random() * .75 - (speed - 270) / 1000);
        }
        obstacles.forEach((obstacle) => {
          obstacle.x -= speed * dt;
          if (!obstacle.passed && obstacle.x + obstacle.width < 0) { obstacle.passed = true; score += 10; scoreEl.textContent = String(score); playTone(740, .045, "triangle"); }
          if (player.x + player.width > obstacle.x + 3 && player.x < obstacle.x + obstacle.width - 3 && player.y + player.height > obstacle.y + 4) endGame();
        });
        obstacles = obstacles.filter((obstacle) => obstacle.x + obstacle.width > -4);
        speedEl.textContent = `${(speed / 270).toFixed(1)}×`;
      }
      function draw() {
        const gradient = ctx.createLinearGradient(0, 0, 0, height); gradient.addColorStop(0, "#0b1520"); gradient.addColorStop(1, "#111c23"); ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(101,233,255,.17)"; for (let i = 0; i < 32; i += 1) { const x = (i * 113 + 31) % width, y = 28 + (i * 67) % 210; ctx.fillRect(x, y, 2, 2); }
        ctx.fillStyle = "#1b2930"; ctx.fillRect(0, groundY, width, height - groundY); ctx.strokeStyle = "#65e9ff"; ctx.globalAlpha = .52; ctx.beginPath(); ctx.moveTo(0, groundY + .5); ctx.lineTo(width, groundY + .5); ctx.stroke(); ctx.globalAlpha = 1;
        ctx.strokeStyle = "rgba(165,255,101,.18)"; ctx.lineWidth = 2; for (let x = -groundOffset; x < width; x += 42) { ctx.beginPath(); ctx.moveTo(x, groundY + 20); ctx.lineTo(x - 15, groundY + 25); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 14, groundY + 37); ctx.lineTo(x + 7, groundY + 37); ctx.stroke(); }
        obstacles.forEach((obstacle) => { ctx.fillStyle = "#ff6688"; ctx.shadowColor = "#ff6688"; ctx.shadowBlur = 10; ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height); ctx.fillStyle = "#ffb0bf"; ctx.fillRect(obstacle.x + 4, obstacle.y + 5, 3, Math.max(6, obstacle.height - 12)); ctx.shadowBlur = 0; });
        ctx.fillStyle = "#a5ff65"; ctx.shadowColor = "#a5ff65"; ctx.shadowBlur = 12; ctx.fillRect(player.x, player.y, player.width, player.height); ctx.shadowBlur = 0;
        ctx.fillStyle = "#17311e"; ctx.fillRect(player.x + 19, player.y + 10, 4, 4); ctx.fillRect(player.x + 7, player.y + 21, 16, 3); ctx.fillStyle = "#65e9ff"; ctx.fillRect(player.x + 5, player.y + player.height - 5, 8, 5); ctx.fillRect(player.x + 19, player.y + player.height - 5, 7, 5);
      }
      function endGame() {
        if (state !== "running") return;
        state = "over"; titleEl.textContent = "撞上障碍！"; messageEl.textContent = `成功躲过 ${score / 10} 个障碍，获得 ${score} 分。`; startButton.textContent = "再跑一次"; overlay.hidden = false; statusEl.textContent = "本局结束，碰撞不计入得分。"; playTone(160, .25, "sawtooth"); submitScore();
      }
      function getAudio() { if (audioContext) return audioContext; const Type = window.AudioContext || window.webkitAudioContext; if (!Type) return null; try { audioContext = new Type(); return audioContext; } catch (error) { console.warn("Unable to initialize runner audio.", error); return null; } }
      function playTone(frequency, duration, type = "square") { const audio = getAudio(); if (!audio) return; if (audio.state === "suspended") audio.resume().catch((error) => console.warn("Unable to resume runner audio.", error)); const now = audio.currentTime, oscillator = audio.createOscillator(), gain = audio.createGain(); oscillator.type = type; oscillator.frequency.setValueAtTime(frequency, now); oscillator.frequency.exponentialRampToValueAtTime(Math.max(70, frequency * .65), now + duration); gain.gain.setValueAtTime(.03, now); gain.gain.exponentialRampToValueAtTime(.001, now + duration); oscillator.connect(gain); gain.connect(audio.destination); oscillator.start(now); oscillator.stop(now + duration); }
      function renderLeaderboard(list, entries, empty) {
        list.replaceChildren(); if (!entries.length) { const li = document.createElement("li"); li.className = "leaderboard-empty"; li.textContent = empty; list.append(li); return; }
        entries.forEach((entry, index) => {
          const row = document.createElement("li"); row.className = "leaderboard-row"; const rank = document.createElement("span"); rank.className = "leaderboard-rank"; rank.textContent = String(index + 1).padStart(2, "0");
          const person = document.createElement("span"); person.className = "leaderboard-person"; const avatar = document.createElement("span"); avatar.className = "leaderboard-avatar"; avatar.textContent = entry.profiles && entry.profiles.avatar || "🟢";
          try { const photo = new URL(avatar.textContent), project = new URL(window.GAME_SITE_SUPABASE.url); if (photo.origin === project.origin && photo.pathname.startsWith("/storage/v1/object/public/profile-avatars/")) { const image = document.createElement("img"); image.src = photo.href; image.alt = ""; avatar.replaceChildren(image); } } catch (error) { /* Emoji avatars are not URLs. */ }
          const name = document.createElement("span"); name.className = "leaderboard-name"; name.textContent = entry.profiles && entry.profiles.nickname || "玩家"; const date = document.createElement("time"); date.className = "leaderboard-date"; date.dateTime = entry.created_at; date.textContent = new Date(entry.created_at).toLocaleDateString("zh-CN"); name.append(date); person.append(avatar, name);
          const points = document.createElement("strong"); points.className = "leaderboard-score"; points.textContent = Number(entry.score).toLocaleString("en-US"); row.append(rank, person, points); list.append(row);
        });
      }
      async function refreshLeaderboards() { if (!window.gameSite.isConfigured) { renderLeaderboard(globalList, [], "排行榜服务尚未配置。"); renderLeaderboard(personalList, [], "排行榜服务尚未配置。"); return; } try { renderLeaderboard(globalList, await window.gameSite.getScores(gameSlug, "global", 10), "还没有玩家上榜，完成挑战来占位。"); if (window.gameSite.user) renderLeaderboard(personalList, await window.gameSite.getScores(gameSlug, "personal", 5), "完成一局后查看个人成绩。"); else renderLeaderboard(personalList, [], "登录后查看个人前五成绩。"); } catch (error) { renderLeaderboard(globalList, [], "排行榜暂时无法加载。"); renderLeaderboard(personalList, [], "排行榜暂时无法加载。"); statusEl.textContent = error.message; } }
      async function submitScore() { if (!score) { refreshLeaderboards(); return; } try { await window.gameSite.submitScore(gameSlug, score); await refreshLeaderboards(); } catch (error) { statusEl.textContent = error.message.includes("登录后") ? "登录后可提交成绩。" : "成绩提交失败。"; console.error("Unable to submit runner score.", error); } }
      startButton.addEventListener("click", startGame); document.getElementById("jumpButton").addEventListener("click", jump); canvas.addEventListener("pointerdown", jump);
      document.addEventListener("keydown", (event) => { if (!["Space", "ArrowUp", "KeyW"].includes(event.code)) return; event.preventDefault(); if (!event.repeat) jump(); });
    })();
  </script>
</body>
</html>
